# TP4 Kubernetes - cluster kind : 1 control plane + 2 workers
# Le port 30080 du nœud control-plane est publié sur la machine hôte
# (c'est le nodePort du Service whoami).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tp-k8s
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
  - role: worker
  - role: worker
